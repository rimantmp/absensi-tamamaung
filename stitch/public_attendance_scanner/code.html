<style>
        .scanner-frame {
            position: relative;
            overflow: hidden;
        }
        
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: theme('colors.success');
            box-shadow: 0 0 10px theme('colors.success'), 0 0 20px theme('colors.success');
            top: 0;
            animation: scan 2s infinite linear;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .corner-bracket {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid theme('colors.brand-ochre');
        }

        .corner-tl { top: 0; left: 0; border-right: none; border-bottom: none; border-top-left-radius: 12px; }
        .corner-tr { top: 0; right: 0; border-left: none; border-bottom: none; border-top-right-radius: 12px; }
        .corner-bl { bottom: 0; left: 0; border-right: none; border-top: none; border-bottom-left-radius: 12px; }
        .corner-br { bottom: 0; right: 0; border-left: none; border-top: none; border-bottom-right-radius: 12px; }
    </style>
</head>

        </h1>
<p class="font-body-md text-body-md text-muted">

        </p>
</header>
<!-- Scanner Area -->
<main class="w-full max-w-2xl flex flex-col items-center gap-lg">
<!-- Video Feed Container (Simulated) -->
<div class="relative w-full aspect-[4/3] max-w-lg bg-surface-container-high rounded-xl border border-hairline overflow-hidden flex items-center justify-center">
<!-- Simulated Video Background -->
<div class="absolute inset-0 bg-surface-dim opacity-50 flex items-center justify-center">
<span class="material-symbols-outlined text-muted" style="font-size: 64px;">
                    videocam
                </span>
</div>
<!-- Scanner Overlay -->
<div class="scanner-frame absolute inset-0 m-xl">
<div class="corner-bracket corner-tl"></div>
<div class="corner-bracket corner-tr"></div>
<div class="corner-bracket corner-bl"></div>
<div class="corner-bracket corner-br"></div>
<div class="scan-line"></div>
</div>
<div class="absolute bottom-md right-md bg-surface px-sm py-xs rounded-full border border-hairline flex items-center gap-xs">
<span class="w-2 h-2 rounded-full bg-success animate-pulse"></span>
<span class="font-body-sm text-body-sm text-ink">Kamera Aktif</span>
</div>
</div>
<!-- Result Card (Simulated Last Scan) -->
<div class="w-full bg-surface-container-lowest rounded-xl p-lg border border-hairline flex flex-col sm:flex-row items-center gap-md">
<!-- Avatar Placeholder -->
<div class="w-20 h-20 rounded-full bg-brand-lavender flex-shrink-0 flex items-center justify-center overflow-hidden border-2 border-surface">
<span class="material-symbols-outlined text-primary" style="font-size: 40px; font-variation-settings: 'FILL' 1;">
                    person
                </span>
</div>
<!-- Student Info -->

</div>
</div>

                    check_circle
                </span>
<span class="font-button text-button text-success uppercase tracking-wide">Hadir</span>
<span class="font-body-sm text-body-sm text-muted mt-xxs">07:15 AM</span>
</div>
